<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 6-7</title>
    <link rel="stylesheet" href="../../styles/lab1/lab1.css">
    <link rel="stylesheet" href="../../styles/general.css">
</head>
    <body>
        <a class="main-link" href="../../index.html">На головну</a>

        <div>
            <h3>Завдання 6-7</h3>
            
            <input type="text" id="product-input" placeholder="Введіть назву товару">
            
            <select id="product-select" onchange="document.getElementById('product-input').value = ''">
                <option value="-1">-- Оберіть товар --</option>
                <option value="0">Валіза</option>
                <option value="1">Валентинка</option>
                <option value="2">Лампа</option>
            </select>

            <button onclick="getQuantityWithPrice()">Наявна кількість і вартість</button>
            <button onclick="totalSum()">Загальна сума</button>

            <p id="quantity-output"></p>
            <p id="cost-output"></p>
            <p id="total-output"></p>
        </div>

        <script>
            const products = ["Валіза", "Валентинка", "Лампа"];
            const quantity = [105, 200, 50];
            const cost = [26, 45.5, 80];

            let selectedIndex = -1;

            function getQuantityWithPrice() {
                const productInput = document.getElementById('product-input');
                const productName = productInput.value.trim();
                const productSelect = document.getElementById('product-select');
                const quantityText = document.getElementById('quantity-output');
                const costText = document.getElementById('cost-output');
                const totalText = document.getElementById('total-output');

                console.log(productName);
                console.log(productSelect.value);
                console.log(quantityText);
                console.log(costText);

                selectedIndex = -1;
                quantityText.innerText = '';
                costText.innerText = '';
                totalText.innerText = '';

                // Перевіряємо, що саме користувач використовував останнім
                if (productName !== '') {
                    // Якщо щось введено вручну, шукаємо в масиві
                    for (let i = 0; i < products.length; i++) {
                        if (products[i].toLowerCase() === productName.toLowerCase()) {
                            selectedIndex = i;
                            productSelect.value = i;
                            break;
                        }
                    }
                    if (selectedIndex === -1) {
                        productSelect.value = '-1';
                    }
                } else if (productSelect.value !== '-1') {
                    // Якщо інпут порожній, берем вибір зі списку
                    selectedIndex = parseInt(productSelect.value);
                }

                if (selectedIndex !== -1) {
                    quantityText.innerText = 'Кількість на складі: ' + quantity[selectedIndex];
                    costText.innerText = 'Вартість за одиницю: ' + cost[selectedIndex] + ' грн';
                } else {
                    quantityText.innerText = 'Товар не знайдено';
                }
            }

            function totalSum() {
                const totalText = document.getElementById('total-output');

                console.log(selectedIndex);
                console.log(totalText);

                if (selectedIndex === -1) {
                    totalText.innerText = 'Спочатку знайдіть наявний товар';
                } else {
                    const totalCost = quantity[selectedIndex] * cost[selectedIndex];
                    totalText.innerText = 'Загальна вартість товару на складі: ' + totalCost + ' грн';
                }
            }
        </script>
    </body>
</html>
